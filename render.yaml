# Single-service Render Blueprint for ULTRON.
#
# One web service runs the Next.js app and the MQTT ingest runtime in the same
# process. The live data path is pub/sub end to end:
#
#   gateway --MQTT publish--> EMQX --MQTT subscribe--> this service
#           --WebSocket publish--> browser (wss://<service>.onrender.com/ws/live)
#   this service --MQTT publish--> EMQX --MQTT subscribe--> gateway (commands)
#
# The service therefore dials out to the broker; the broker never calls in, and
# there is no ingest webhook to expose. Health: https://<service>.onrender.com/health
#
# Fill sync:false values in the Render dashboard during Blueprint setup.

services:
  - type: web
    name: ultron
    runtime: node
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: AUTH_SECRET
        generateValue: true
      - key: CAPTCHA_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: LIVE_NOTIFY_DATABASE_URL
        sync: false
      # mqtt = broker subscription only. `both` additionally opens the direct
      # gateway WebSocket door at /ws/gateway as a broker-outage fallback.
      - key: INGEST_TRANSPORT
        value: mqtt
      - key: LIVE_WS_PATH
        value: /ws/live
      # EMQX connection for this service's subscription and command publishes.
      - key: MQTT_HOST
        sync: false
      - key: MQTT_PORT
        value: 8883
      - key: MQTT_USE_TLS
        value: true
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_BACKEND_CLIENT_ID
        value: ultron-app-ingest
      - key: MQTT_SUBSCRIBE_QOS
        value: 1
      - key: MQTT_MAX_PAYLOAD_BYTES
        value: 262144
      - key: MQTT_COMMAND_TIMEOUT_MS
        value: 10000
      - key: PERSISTENCE_ENABLED
        value: true
      - key: STALE_AFTER_S
        value: 15
      - key: METRICS_FLUSH_INTERVAL_MS
        value: 2000
      - key: CRON_SECRET
        generateValue: true
      - key: ABSTRACT_EMAIL_REPUTATION_API_KEY
        sync: false
      # Canonical public origin, used to build password-reset links. Without it
      # the link falls back to the request Host header, which a client controls.
      - key: APP_ORIGIN
        sync: false
      # SMTP for password-reset email. Leave SMTP_HOST unset to disable outbound
      # mail; the reset endpoint still answers normally (it must never reveal
      # whether an account exists) but nothing is delivered.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # --- ULTRON ML service ------------------------------------------------
      # Advisory and optional. Unset means the Analyzer runs the deterministic
      # DOC-02..DOC-05 chain exactly as before; nothing here is on the critical
      # path and nothing waits on it.
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_INTERNAL_TOKEN
        sync: false
      - key: ML_TIMEOUT_MS
        value: 4000
      - key: ML_FEED_INTERVAL_MS
        value: 5000
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: USER_PASSWORD
        sync: false

  # The ML service. Commented out rather than deleted: it is a real deployment
  # target and the settings below are the ones that matter, but nothing should
  # start paying for a service that currently has no promoted model to serve.
  # Uncomment when there is one, and set ML_SERVICE_URL on the web service to
  # this service's internal address.
  #
  # - type: web
  #   name: ultron-ml
  #   runtime: docker
  #   dockerfilePath: ./services/ml/Dockerfile
  #   dockerContext: ./services/ml
  #   healthCheckPath: /health
  #   # One instance. The pipeline holds rolling windows and decision-filter
  #   # state in memory per machine; several instances would each see a fraction
  #   # of the telemetry and none would hold a full window. Scaling out needs
  #   # ML_REDIS_URL, which moves that state somewhere every instance can reach.
  #   numInstances: 1
  #   envVars:
  #     # shadow: models run and predictions persist, but nobody is alerted.
  #     # The mode to live in until engineering has compared predictions against
  #     # confirmed outcomes. Rolling back is a change to this one variable.
  #     - key: ML_MODE
  #       value: shadow
  #     - key: ML_INTERNAL_TOKEN
  #       sync: false
  #     - key: ML_DATABASE_URL
  #       sync: false
  #     - key: ML_REDIS_URL
  #       sync: false
  #     - key: ML_INFERENCE_INTERVAL_SECONDS
  #       value: 2
  #     - key: ML_LOG_LEVEL
  #       value: INFO
  #     # Leave false. The guard that stops a model fitted on synthetic
  #     # fixtures becoming champion.
  #     - key: ML_ALLOW_UNTRAINED_CHAMPION
  #       value: false
