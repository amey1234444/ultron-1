# Render config — MQTT ingest deployed as a FREE web service (Blueprints and
# Background Workers require a card; a free-plan Web Service does not).
# index.js opens an HTTP health endpoint on $PORT (services/mqtt-ingest/health.js)
# so it qualifies as a web service, and the keep-alive workflow
# (.github/workflows/keepalive-mqtt-ingest.yml) pings it every 10 minutes so
# the free instance never spins down.
#
# The worker reads files from the repo root (contracts/json-schema/,
# supabase/migrations/), so it builds from the repo root and cd's in.
#
# One-time manual setup on https://dashboard.render.com (no card needed):
#   New + → Web Service → connect this repo →
#     Instance type: Free
#     Branch:        1783405085-nextjs-vercel-auth
#     Root directory: (leave empty = repo root)
#     Build command:  cd services/mqtt-ingest && npm install
#     Start command:  cd services/mqtt-ingest && node index.js
#     Env vars:       see below (PORT is injected by Render automatically)
#   Then add two GitHub repo secrets:
#     RENDER_DEPLOY_HOOK_MQTT_INGEST  (Settings → Deploy Hook URL)
#     MQTT_INGEST_URL                 (the service's https://...onrender.com URL)
services:
  - type: web
    name: ultron-mqtt-ingest
    runtime: node
    plan: free
    branch: 1783405085-nextjs-vercel-auth
    # Deploys are driven by the GitHub Actions workflow (deploy hook), which
    # covers main/master/dev/*/feature/* pushes too.
    autoDeploy: false
    healthCheckPath: /healthz
    buildCommand: cd services/mqtt-ingest && npm install
    startCommand: cd services/mqtt-ingest && node index.js
    envVars:
      - key: MQTT_URL
        sync: false # e.g. mqtts://your-emqx-host:8883
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_CLIENT_ID
        value: ultron-backend-ingress-01
      - key: MQTT_REJECT_UNAUTHORIZED
        value: "1"
      - key: DATABASE_URL
        sync: false # Supabase Postgres connection string
      - key: STALE_AFTER_S
        value: "15"
