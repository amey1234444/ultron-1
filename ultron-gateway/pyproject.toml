[project]
name = "ultron-gateway"
version = "1.0.0"
description = "Ultron gateway: CC/RCC (or simulator) -> canonical rack model -> MQTT 5/TLS -> EMQX"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.1.0",
    "websocket-client>=1.8.0",
]

[project.scripts]
ultron-gateway = "ultron_gateway.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
