# Reference configuration. Environment variables take precedence (see
# .env.example); this documents the full configuration surface for the
# Raspberry Pi deployment (/etc/ultron-gateway/gateway.env).
gateway:
  gateway_id: ultron-gw-demo-01    # match the Gateway Script ID shown in Devices
  rack_id: 1                       # legacy single-rack fallback
  rack_ids: [1, 2, 3, 4]           # match Rack Script IDs shown inside the gateway
  gateway_ip: 192.168.10.10        # or primary_interface: eth0
transport:
  mode: websocket
  direct_ws_url: wss://YOUR-RENDER-INGEST.onrender.com/ws/gateway
  # DIRECT_WS_TOKEN is supplied from the environment, not this file.
mqtt:
  host: your-emqx-host # fallback only when GATEWAY_TRANSPORT=mqtt
  port: 8883
  tls: true
  client_id: ultron-gw-ultron-gw-demo-01 # derived: ultron-gw-{gateway_id}
telemetry:
  interval_s: 0.5
state_dir: /var/lib/ultron-gateway
