name: Deploy to Vercel

# Auto-deploy the Next.js app to Vercel on every push to main/master or the
# active nextjs-vercel-auth working branch.
#
# Required GitHub Repository Secrets:
# - VERCEL_TOKEN
# - VERCEL_ORG_ID
# - VERCEL_PROJECT_ID
# - AUTH_SECRET
# - CAPTCHA_SECRET
# - DATABASE_URL
# - MQTT_INGEST_SECRET
# - CRON_SECRET (optional)
# - MQTT_STALE_AFTER_S (optional)
# - MQTT_BROWSER_WS_URL (optional; enables browser-direct broker subscription)
# - MQTT_BROWSER_USERNAME (optional; must be a subscribe-only broker user)
# - MQTT_BROWSER_PASSWORD (optional)
# - ABSTRACT_EMAIL_REPUTATION_API_KEY (optional; signup email-reputation gate)
# - SUPER_ADMIN_PASSWORD
# - ADMIN_PASSWORD
# - USER_PASSWORD
# - APP_ORIGIN (recommended; canonical origin for password-reset links)
# - SMTP_HOST (optional; enables password-reset email)
# - SMTP_PORT / SMTP_SECURE / SMTP_USER / SMTP_PASS / SMTP_FROM (with SMTP_HOST)
#
# Note on SMTP: these are runtime-only, server-side values. They are not read
# during `vercel build` (only NEXT_PUBLIC_* is inlined at build time), so they
# exist here purely so this workflow can push them into the Vercel production
# environment where the app actually runs.

on:
  push:
    branches:
      - main
      - master
      - 1783405085-nextjs-vercel-auth

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Existing Vercel deployment configuration
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Application secrets from GitHub Repository Secrets
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      CAPTCHA_SECRET: ${{ secrets.CAPTCHA_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MQTT_INGEST_SECRET: ${{ secrets.MQTT_INGEST_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      MQTT_STALE_AFTER_S: ${{ secrets.MQTT_STALE_AFTER_S }}
      MQTT_BROWSER_WS_URL: ${{ secrets.MQTT_BROWSER_WS_URL }}
      MQTT_BROWSER_USERNAME: ${{ secrets.MQTT_BROWSER_USERNAME }}
      MQTT_BROWSER_PASSWORD: ${{ secrets.MQTT_BROWSER_PASSWORD }}
      ABSTRACT_EMAIL_REPUTATION_API_KEY: ${{ secrets.ABSTRACT_EMAIL_REPUTATION_API_KEY }}
      SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}

      # Password-reset email
      APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Keep the existing project-linking/pull behavior.
      - name: Pull Vercel project settings
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      # Verify required GitHub secrets exist.
      # This checks only whether they are present.
      # Secret values are never printed.
      - name: Verify required deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          check_secret() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "::error::$name is missing or empty"
              missing=1
            else
              echo "$name is configured"
            fi
          }

          check_secret "AUTH_SECRET" "$AUTH_SECRET"
          check_secret "DATABASE_URL" "$DATABASE_URL"
          check_secret "MQTT_INGEST_SECRET" "$MQTT_INGEST_SECRET"
          check_secret "SUPER_ADMIN_PASSWORD" "$SUPER_ADMIN_PASSWORD"
          check_secret "ADMIN_PASSWORD" "$ADMIN_PASSWORD"
          check_secret "USER_PASSWORD" "$USER_PASSWORD"

          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more required deployment secrets are missing."
            exit 1
          fi

          # CAPTCHA_SECRET is optional because the application
          # falls back to AUTH_SECRET when it is unset.
          if [ -n "$CAPTCHA_SECRET" ]; then
            echo "CAPTCHA_SECRET is configured"
          else
            echo "CAPTCHA_SECRET is not configured; application fallback to AUTH_SECRET remains unchanged"
          fi

          if [ -n "$CRON_SECRET" ]; then
            echo "CRON_SECRET is configured"
          else
            echo "CRON_SECRET is not configured; MQTT_INGEST_SECRET can secure manual stale-gateway maintenance"
          fi

          if [ -n "$MQTT_STALE_AFTER_S" ]; then
            echo "MQTT_STALE_AFTER_S is configured"
          else
            echo "MQTT_STALE_AFTER_S is not configured; application default is 15 seconds"
          fi

          # The browser subscribes to the broker itself when these are set,
          # which is the low-latency display path. Without them the UI stays on
          # /api/live/stream.
          if [ -n "$MQTT_BROWSER_WS_URL" ]; then
            echo "MQTT_BROWSER_WS_URL is configured"
          else
            echo "MQTT_BROWSER_WS_URL is not configured; the UI uses /api/live/stream instead of the broker"
          fi

          # ABSTRACT_EMAIL_REPUTATION_API_KEY is optional: the signup email
          # reputation gate fails OPEN when it is absent (accounts are still
          # created, with reputation status 'unknown').
          if [ -n "$ABSTRACT_EMAIL_REPUTATION_API_KEY" ]; then
            echo "ABSTRACT_EMAIL_REPUTATION_API_KEY is configured"
          else
            echo "ABSTRACT_EMAIL_REPUTATION_API_KEY is not configured; signup email-reputation check fails open (status 'unknown')"
          fi

          # Password reset needs a canonical origin. Without it the reset link is
          # built from the request Host header, which a client controls — a
          # spoofed Host would put an attacker's domain in the email.
          if [ -n "$APP_ORIGIN" ]; then
            echo "APP_ORIGIN is configured"
          else
            echo "::warning::APP_ORIGIN is not configured; password-reset links will be built from the Host header"
          fi

          # SMTP is optional. Without it the forgot-password endpoint still
          # answers normally (it must never reveal whether an account exists),
          # but no reset email is ever delivered.
          if [ -n "$SMTP_HOST" ]; then
            echo "SMTP_HOST is configured"
            if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then
              echo "::warning::SMTP_HOST is set but SMTP_USER/SMTP_PASS are not; sending will be attempted unauthenticated"
            fi
          else
            echo "::warning::SMTP_HOST is not configured; password-reset email will NOT be delivered"
          fi

      # Synchronize GitHub Repository Secrets into the
      # Vercel Production environment.
      #
      # Values are passed through STDIN and are not printed.
      - name: Sync application secrets to Vercel production
        shell: bash
        run: |
          set -euo pipefail

          sync_secret() {
            local name="$1"
            local value="$2"

            printf '%s' "$value" | vercel env add \
              "$name" \
              production \
              --force \
              --sensitive \
              --token="$VERCEL_TOKEN"

            echo "$name synchronized"
          }

          sync_secret "AUTH_SECRET" "$AUTH_SECRET"
          sync_secret "DATABASE_URL" "$DATABASE_URL"
          sync_secret "MQTT_INGEST_SECRET" "$MQTT_INGEST_SECRET"
          sync_secret "SUPER_ADMIN_PASSWORD" "$SUPER_ADMIN_PASSWORD"
          sync_secret "ADMIN_PASSWORD" "$ADMIN_PASSWORD"
          sync_secret "USER_PASSWORD" "$USER_PASSWORD"

          # Preserve the application's existing CAPTCHA fallback behavior.
          # Only create/update CAPTCHA_SECRET when a value was actually provided.
          if [ -n "$CAPTCHA_SECRET" ]; then
            sync_secret "CAPTCHA_SECRET" "$CAPTCHA_SECRET"
          fi

          if [ -n "$CRON_SECRET" ]; then
            sync_secret "CRON_SECRET" "$CRON_SECRET"
          fi

          if [ -n "$MQTT_STALE_AFTER_S" ]; then
            sync_secret "MQTT_STALE_AFTER_S" "$MQTT_STALE_AFTER_S"
          fi

          if [ -n "$MQTT_BROWSER_WS_URL" ]; then
            sync_secret "MQTT_BROWSER_WS_URL" "$MQTT_BROWSER_WS_URL"
            sync_secret "MQTT_BROWSER_USERNAME" "$MQTT_BROWSER_USERNAME"
            sync_secret "MQTT_BROWSER_PASSWORD" "$MQTT_BROWSER_PASSWORD"
          fi

          if [ -n "$ABSTRACT_EMAIL_REPUTATION_API_KEY" ]; then
            sync_secret "ABSTRACT_EMAIL_REPUTATION_API_KEY" "$ABSTRACT_EMAIL_REPUTATION_API_KEY"
          fi

          if [ -n "$APP_ORIGIN" ]; then
            sync_secret "APP_ORIGIN" "$APP_ORIGIN"
          fi

          # Only push SMTP when a host is present, so a half-configured mail
          # setup cannot overwrite a working one in Vercel with blanks.
          if [ -n "$SMTP_HOST" ]; then
            sync_secret "SMTP_HOST" "$SMTP_HOST"
            sync_secret "SMTP_USER" "$SMTP_USER"
            sync_secret "SMTP_PASS" "$SMTP_PASS"
            # Explicit if-blocks rather than `[ -n x ] && cmd`: under
            # `set -euo pipefail` a false test as the head of an && list is an
            # easy way to abort the whole workflow by accident.
            if [ -n "$SMTP_PORT" ]; then
              sync_secret "SMTP_PORT" "$SMTP_PORT"
            fi
            if [ -n "$SMTP_SECURE" ]; then
              sync_secret "SMTP_SECURE" "$SMTP_SECURE"
            fi
            if [ -n "$SMTP_FROM" ]; then
              sync_secret "SMTP_FROM" "$SMTP_FROM"
            fi
          fi

      # Pull again so the local Vercel build environment contains
      # the secrets that were just synchronized.
      - name: Refresh Vercel production environment
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      # Existing build behavior remains unchanged.
      - name: Build project artifacts
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

      # Existing production deployment behavior remains unchanged.
      - name: Deploy to Vercel production
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
