# Training configuration: the starting points, and the ranges to search.
#
# Written as data so the CLI defaults, this documentation and any hyperparameter
# study read the same numbers. Nothing here is tuned — a tuned value would need
# a dataset with confirmed faults to tune against, and there is not one yet.

temporal:
  lookback_steps_candidates: [120, 300, 600]   # 2, 5 and 10 minutes at 1 Hz
  lookback_steps: 300
  step_seconds: 1.0
  horizon_steps: 1
  lstm_units: [64, 32]
  embedding_units: 32
  dropout: 0.20
  dropout_range: [0.1, 0.3]
  learning_rate: 0.001
  learning_rate_range: [0.0001, 0.003]
  batch_size: 128
  batch_size_candidates: [64, 128, 256]
  max_epochs: 100
  early_stopping_patience: 12
  early_stopping_patience_range: [10, 15]
  gradient_clip_norm: 1.0
  loss: huber            # a process spike should count as an outlier, not as
                         # a hundred ordinary samples
  scaler: robust         # median/IQR, because these signals are skewed
  min_sequence_completeness: 0.85
  # Forecast channels are configuration, never a constant in the model code.
  # A site with different instrumentation changes this file, not Python.
  forecast_channels:
    - TS-P3   # screen inlet melt pressure
    - TS-P4   # screen outlet melt pressure
    - TS-PM1  # drive load
    - TS-TM   # melt temperature
    - TS-TZ4  # mid-barrel zone
    - TS-TZ5
    - TS-F1   # feed rate
    - TS-S1   # screw speed

trees:
  learning_rate: 0.03
  learning_rate_range: [0.005, 0.1]
  num_leaves: 31
  num_leaves_range: [15, 127]
  max_depth: 6
  max_depth_range: [4, 8]
  min_child_samples: 50
  min_child_samples_range: [30, 100]
  n_estimators: 2000
  early_stopping_rounds: 100
  feature_fraction: 0.8
  bagging_fraction: 0.8
  reg_alpha_range: [0.0, 5.0]
  reg_lambda_range: [0.0, 10.0]
  # PR-AUC, never accuracy. At a 0.2% positive rate a model that always answers
  # "no fault" is 99.8% accurate and worth nothing.
  objective_metric: average_precision

xgboost:
  tree_method: hist
  max_depth: 5
  max_depth_range: [4, 6]
  min_child_weight: 10
  min_child_weight_range: [5, 20]
  subsample: 0.8
  colsample_bytree: 0.8
  gamma_range: [0.0, 5.0]

labels:
  horizons_minutes: [5, 15, 30]
  trusted_only: true
  exclude_uncertain_band: true
  exclude_after_onset: true
  exclude_post_maintenance_seconds: 1800
  # Below this many confirmed events a fault is not modelled at all: a
  # classifier fitted on three positives memorises three timestamps.
  min_positive_events: 8
  min_positive_samples: 50

splits:
  train_fraction: 0.70
  valid_fraction: 0.15
  # The gap between splits is lookback + horizon. Ten minutes plus thirty is
  # forty minutes, and anything shorter lets a row's window or its label reach
  # across the boundary.
  max_lookback_seconds: 600
  max_horizon_minutes: 30

calibration:
  method: auto            # isotonic above 200 validation positives, else Platt
  isotonic_min_positives: 200
  fit_on: valid           # enforced in code; train or test raise
