[project]
name = "ultron-predictive-intelligence"
version = "0.1.0"
description = "ULTRON Predictive Intelligence Engine: standalone, advisory-only predictive diagnosis/prognosis for extruders"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.3,<5",
    "xgboost>=2.0,<4",
    "shap>=0.46,<1",
    "tensorflow-cpu>=2.16,<2.21",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "prometheus-client>=0.20,<1",
    "structlog>=24.1",
    "mlflow-skinny>=2.14,<4",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
mqtt = ["paho-mqtt>=2.1"]
tuning = ["optuna>=3.6"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
]

[project.scripts]
ultron-ml = "ultron_ml.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ultron_ml = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012", "B008", "N806", "N803", "N802", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N", "SIM", "B011"]

[tool.mypy]
python_version = "3.12"
packages = ["ultron_ml"]
mypy_path = "src"
strict = false
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = [
    "slow: slow model tests",
    "e2e: end-to-end scenarios",
]
env = []

[tool.coverage.run]
source = ["ultron_ml"]
branch = true
omit = ["*/adapters/mqtt/*", "*/cli.py"]

[tool.coverage.report]
show_missing = false
skip_empty = true
